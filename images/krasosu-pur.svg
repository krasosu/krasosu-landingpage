<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 156" width="300" height="156" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">krasosu</title>
  <desc id="d">krasosu, das u durchgestrichen und durch ein o ersetzt – Kraus Software Solutions. It's not a bug, it's a feature.</desc>
  <style>
    .ink    { fill: #1d2b3a; }
